<title>استعادة الدخول | المنصة العقارية</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f4ee;color:#17212b;font-family:Tahoma,Arial,sans-serif;line-height:1.7}.box{width:min(540px,92%);margin:48px auto;background:white;padding:28px;border:1px solid #e7e4de;border-radius:20px}h1{color:#0d2438;font-size:26px}label{display:block;margin:16px 0 6px}input,button{font:inherit;font-size:16px;width:100%;padding:12px;border-radius:10px}input{border:1px solid #ccc}button{border:0;background:#c79a45;color:#14283a;font-weight:bold;cursor:pointer;margin-top:20px}button:disabled{opacity:.6;cursor:wait}a{color:#14597d}#message{padding:12px;border-radius:8px;overflow-wrap:anywhere}#message:empty{display:none}.error{background:#fff0f0;color:#942626}.success{background:#edf9f0;color:#176d36}.muted{color:#59636e;font-size:14px}[hidden]{display:none!important}:focus-visible{outline:3px solid #267299;outline-offset:2px}.show{display:flex;gap:8px;align-items:center}.show input{width:auto}@media(max-width:500px){.box{padding:20px;margin:24px auto}}
</style>
<script src="vendor/supabase.js" defer></script>
<script src="common.js" defer></script>
<script src="recover.js?v=20260914-1" defer></script>
</head>
<body><main class="box"><a href="admin.html">العودة إلى تسجيل الدخول</a><h1>استعادة الدخول</h1>
<p id="intro">أدخل البريد المسجّل لحسابك لإرسال رابط إعادة تعيين كلمة المرور.</p>
<form id="requestForm"><label for="recoveryEmail">البريد الإلكتروني</label><input id="recoveryEmail" type="email" autocomplete="email" dir="ltr" required maxlength="254"><button id="sendRecovery" type="submit" disabled>إرسال رابط الاستعادة</button></form>
<form id="passwordForm" hidden><label for="newPassword">كلمة المرور الجديدة</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" required><label for="confirmPassword">تأكيد كلمة المرور</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required><label class="show"><input id="showPassword" type="checkbox">إظهار كلمة المرور</label><p class="muted">استخدم 12 حرفًا على الأقل. احتفظ بكلمة المرور في مكان آمن ولا ترسلها في المحادثة.</p><button id="savePassword" type="submit">حفظ كلمة المرور الجديدة</button></form>
<p id="message" role="status" aria-live="polite"></p><p id="finished" hidden><a href="admin.html">الدخول إلى لوحة إدارة العقارات</a></p>
<noscript>فعّل JavaScript لاستخدام الاستعادة، أو تواصل مع مدير الموقع.</noscript>
</main></body></html>
