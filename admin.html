<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة العقارات | المنصة العقارية</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f7f4ee;color:#17212b}.wrap{max-width:1000px;margin:30px auto;padding:0 16px}.box{background:#fff;border:1px solid #e7e4de;border-radius:20px;padding:24px;margin-bottom:18px}h1,h2{color:#0d2438}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}textarea{min-height:100px}.full{grid-column:1/-1}button{border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;background:#c79a45}.danger{background:#fff0f0;color:#a22;border:1px solid #ecc}.muted{color:#66717c;font-size:13px}.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.item{border-top:1px solid #eee;padding:15px 0}.msg{padding:12px;border-radius:10px;margin:10px 0;display:none}.ok{background:#edf9f0;color:#167b3b}.err{background:#fff0f0;color:#a22}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="box" id="loginBox"><h1>إدارة المنصة العقارية</h1><p class="muted">هذه الصفحة خاصة بإدارة العقارات. يجب تسجيل الدخول بحساب الإدارة.</p><div class="grid"><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"></div><br><button onclick="login()">تسجيل الدخول</button><div id="loginMsg" class="msg"></div></div><div id="adminBox" class="hidden"><div class="box"><div class="row"><div><h1>لوحة إدارة العقارات</h1><div id="who" class="muted"></div></div><button class="danger" onclick="logout()">تسجيل الخروج</button></div></div><div class="box"><h2>إضافة عقار</h2><div class="grid"><input id="title" placeholder="اسم العقار"><select id="type"><option>أرض</option><option>مزرعة</option><option>استراحة</option><option>منزل</option><option>تجاري</option></select><input id="area" placeholder="المنطقة"><input id="size" placeholder="المساحة"><input id="price" placeholder="السعر"><input id="video" placeholder="رابط الفيديو"><textarea id="details" class="full" placeholder="تفاصيل العقار"></textarea></div><br><button onclick="addProperty()">نشر العقار</button><div id="addMsg" class="msg"></div></div><div class="box"><div class="row"><h2>العقارات المنشورة</h2><button onclick="loadProperties()">تحديث</button></div><div id="list"></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://ajrvttqqlgsbbxsxfxzl.supabase.co';const SUPABASE_PUBLISHABLE_KEY='YOUR_PUBLISHABLE_KEY';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const $=id=>document.getElementById(id);function message(id,text,ok=false){const e=$(id);e.textContent=text;e.className='msg '+(ok?'ok':'err');e.style.display='block'}async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password){message('loginMsg','أدخل البريد الإلكتروني وكلمة المرور.');return}const{data,error}=await db.auth.signInWithPassword({email,password});if(error){message('loginMsg','فشل تسجيل الدخول.');return}showAdmin(data.user)}async function showAdmin(u){$('loginBox').classList.add('hidden');$('adminBox').classList.remove('hidden');$('who').textContent='مسجل الدخول: '+(u?.email||'');loadProperties()}async function logout(){await db.auth.signOut();location.reload()}async function addProperty(){const p={title:$('title').value.trim(),type:$('type').value,area:$('area').value.trim(),size:$('size').value.trim(),price:$('price').value.trim(),video:$('video').value.trim(),details:$('details').value.trim()};if(!p.title||!p.area){message('addMsg','أدخل اسم العقار والمنطقة.');return}const{error}=await db.from('propeription').insert([p]);if(error){message('addMsg','تعذر النشر.');return}message('addMsg','تم نشر العقار بنجاح.',true);['title','area','size','price','video','details'].forEach(id=>$(id).value='');loadProperties()}async function loadProperties(){const{data,error}=await db.from('propeription').select('*').order('created_at',{ascending:false});if(error){$('list').textContent='تعذر تحميل العقارات.';return}if(!data.length){$('list').innerHTML='<p class="muted">لا توجد عقارات.</p>';return}$('list').innerHTML=data.map(p=>'<div class="item"><div class="row"><div><strong>'+esc(p.title)+'</strong><div class="muted">'+esc(p.area)+' · '+esc(p.size||'')+' · '+esc(p.price||'')+'</div></div><button class="danger" onclick="deleteProperty('+p.id+')">حذف</button></div></div>').join('')}async function deleteProperty(id){if(!confirm('هل تريد حذف هذا العقار نهائيًا؟'))return;const{error}=await db.from('propeription').delete().eq('id',id);if(error){alert('تعذر الحذف.');return}loadProperties()}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}(async()=>{const{data}=await db.auth.getSession();if(data.session)showAdmin(data.session.user)})();</script></body></html>
