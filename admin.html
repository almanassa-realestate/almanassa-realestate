<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://ajrvttqqlgsbbxsxfxzl.supabase.co; connect-src 'self' https://ajrvttqqlgsbbxsxfxzl.supabase.co; base-uri 'self'; form-action 'self'">
<title>إدارة العقارات | المنصة العقارية</title>
<style>
:root{--navy:#0d2438;--gold:#c79a45;--cream:#f7f4ee;--text:#17212b;--muted:#66717c;--line:#e3e3e3;--ok:#167b3b;--err:#9b2828}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--cream);color:var(--text);line-height:1.55}.wrap{max-width:1080px;margin:26px auto;padding:0 16px}.box{background:#fff;border:1px solid #e7e4de;border-radius:20px;padding:22px;margin-bottom:18px}h1,h2{color:var(--navy);margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit;background:#fff}textarea{min-height:115px;resize:vertical}.full{grid-column:1/-1}button,a.btn{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--gold);color:#14283a;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}button.secondary{background:#e9edf0}button.danger{background:#fff0f0;color:#a22;border:1px solid #ecc}button:disabled{opacity:.55;cursor:not-allowed}.muted{color:var(--muted);font-size:13px}.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.item{border-top:1px solid #eee;padding:15px 0}.msg{padding:12px;border-radius:10px;margin:10px 0;display:none}.ok{background:#edf9f0;color:var(--ok)}.err{background:#fff0f0;color:var(--err)}.hidden{display:none!important}.status{font-size:12px;border-radius:999px;padding:4px 8px;background:#eef1f3}.thumb{width:70px;height:55px;object-fit:cover;border-radius:8px;background:#e8ecef}.item-main{display:flex;gap:12px;align-items:center}.actions{display:flex;gap:7px;flex-wrap:wrap}.toplink{font-size:13px;color:var(--navy)}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}.spinner{display:none;margin-inline-start:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.box{padding:17px}}
</style>
</head>
<body><div class="wrap">
<div class="row" style="margin-bottom:12px"><a class="toplink" href="index.html">← العودة إلى الموقع</a><span class="muted">لوحة إدارة خاصة</span></div>
<div class="box" id="loginBox"><h1>إدارة المنصة العقارية</h1><p class="muted">سجّل الدخول بحساب الإدارة أو المحرر.</p><div class="grid"><input id="email" type="email" autocomplete="username" placeholder="البريد الإلكتروني"><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور"></div><br><button id="loginBtn">تسجيل الدخول</button><span id="loginSpin" class="spinner">جارٍ الدخول...</span><div id="loginMsg" class="msg"></div></div>
<div id="adminBox" class="hidden">
<div class="box"><div class="row"><div><h1 style="margin-bottom:4px">لوحة إدارة العقارات</h1><div id="who" class="muted"></div></div><button id="logoutBtn" class="danger">تسجيل الخروج</button></div></div>
<div class="box"><h2>إضافة عقار</h2><div class="grid">
<input id="title" class="full" maxlength="160" placeholder="اسم العقار *">
<select id="type"><option>أرض</option><option>مزرعة</option><option>استراحة</option><option>منزل</option><option>تجاري</option></select>
<select id="area"></select>
<input id="size" type="number" min="0" step="0.01" placeholder="المساحة بالمتر المربع">
<input id="price" type="number" min="0" step="0.01" placeholder="السعر بالدينار">
<select id="priceType"><option value="negotiable">قابل للتفاوض</option><option value="fixed">سعر ثابت</option><option value="on_request">السعر عند الطلب</option></select>
<input id="frontage" type="number" min="0" step="0.01" placeholder="الواجهة بالمتر">
<input id="depth" type="number" min="0" step="0.01" placeholder="العمق بالمتر">
<input id="documents" placeholder="حالة الأوراق / المستندات">
<select id="status"><option value="draft">مسودة</option><option value="published">منشور</option><option value="hidden">مخفي</option></select>
<input id="video" class="full" type="url" placeholder="رابط الفيديو (Facebook / YouTube أو رابط HTTPS)">
<textarea id="description" class="full" maxlength="6000" placeholder="تفاصيل العقار"></textarea>
<label class="full">صورة الغلاف <span class="muted">(JPG/PNG/WebP، حتى 10MB)</span><input id="cover" type="file" accept="image/jpeg,image/png,image/webp"></label>
<label class="check full"><input id="featured" type="checkbox"> عقار مميز</label>
</div><br><button id="addBtn">حفظ العقار</button><span id="addSpin" class="spinner">جارٍ الحفظ...</span><div id="addMsg" class="msg"></div></div>
<div class="box"><div class="row"><h2 style="margin:0">العقارات</h2><button id="refreshBtn" class="secondary">تحديث</button></div><div id="list"><p class="muted">جارٍ التحميل...</p></div></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://ajrvttqqlgsbbxsxfxzl.supabase.co', SUPABASE_PUBLISHABLE_KEY='sb_publishable_AEWw1MQfNtD89ACJTPjmug_ZXAu6rWz';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);let currentUser=null,currentProfile=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function msg(id,text,ok=false){const e=$(id);e.textContent=text;e.className='msg '+(ok?'ok':'err');e.style.display='block'}
function hideMsg(id){$(id).style.display='none'}
function safeHttps(u){if(!u)return '';try{const x=new URL(u);return x.protocol==='https:'?x.href:''}catch{return ''}}
function num(id){const v=$(id).value.trim();return v===''?null:Number(v)}
function setBusy(btn,spin,busy){$(btn).disabled=busy;$(spin).style.display=busy?'inline':'none'}
async function verifySession(user){const{data,error}=await db.from('profiles').select('id,full_name,role,is_active').eq('id',user.id).single();if(error||!data||!data.is_active||!['admin','editor'].includes(data.role)){await db.auth.signOut();throw new Error('لا يملك هذا الحساب صلاحية إدارة الموقع.')}currentUser=user;currentProfile=data;$('loginBox').classList.add('hidden');$('adminBox').classList.remove('hidden');$('who').textContent=`مسجل الدخول: ${user.email||''} — الصلاحية: ${data.role==='admin'?'مدير':'محرر'}`;await Promise.all([loadAreas(),loadProperties()])}
async function init(){const{data}=await db.auth.getSession();if(data.session){try{await verifySession(data.session.user)}catch(e){msg('loginMsg',e.message)}}}
async function login(){hideMsg('loginMsg');const email=$('email').value.trim(),password=$('password').value;if(!email||!password){msg('loginMsg','أدخل البريد الإلكتروني وكلمة المرور.');return}setBusy('loginBtn','loginSpin',true);const{data,error}=await db.auth.signInWithPassword({email,password});if(error){msg('loginMsg','فشل تسجيل الدخول. تحقق من البريد وكلمة المرور.');setBusy('loginBtn','loginSpin',false);return}try{await verifySession(data.user)}catch(e){msg('loginMsg',e.message)}finally{setBusy('loginBtn','loginSpin',false)}}
async function logout(){await db.auth.signOut();location.reload()}
async function loadAreas(){const{data,error}=await db.from('areas').select('id,name,is_active').eq('is_active',true).order('name');if(error)throw error;$('area').innerHTML='';for(const a of data||[]){const o=document.createElement('option');o.value=a.id;o.textContent=a.name;$('area').appendChild(o)}}
async function addProperty(){hideMsg('addMsg');if(!currentUser)return;const title=$('title').value.trim(),area_id=$('area').value,price_type=$('priceType').value,video=safeHttps($('video').value.trim());if(!title||!area_id){msg('addMsg','اسم العقار والمنطقة مطلوبان.');return}if($('video').value.trim()&&!video){msg('addMsg','رابط الفيديو يجب أن يبدأ بـ https://');return}if(price_type!=='on_request'&&num('price')===null){msg('addMsg','أدخل السعر أو اختر «السعر عند الطلب».');return}const file=$('cover').files[0];if(file&&(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10*1024*1024)){msg('addMsg','صورة الغلاف يجب أن تكون JPG/PNG/WebP وأقل من 10MB.');return}setBusy('addBtn','addSpin',true);try{const payload={title,type:$('type').value,area_id,size_m2:num('size'),price:price_type==='on_request'?null:num('price'),price_type,description:$('description').value.trim()||null,frontage_m:num('frontage'),depth_m:num('depth'),documents_status:$('documents').value.trim()||null,status:$('status').value,featured:$('featured').checked,created_by:currentUser.id,updated_by:currentUser.id};const{data,error}=await db.from('properties').insert(payload).select('id').single();if(error)throw error;const propertyId=data.id;if(video){const{error:e}=await db.from('property_videos').insert({property_id:propertyId,video_url:video});if(e)throw e}if(file){const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-zA-Z0-9]/g,'').toLowerCase();const path=`${propertyId}/cover-${Date.now()}.${ext}`;const{error:up}=await db.storage.from('property-media').upload(path,file,{cacheControl:'3600',upsert:false});if(up)throw up;const{error:im}=await db.from('property_images').insert({property_id:propertyId,storage_path:path,alt_text:title,sort_order:0,is_cover:true});if(im)throw im}msg('addMsg','تم حفظ العقار بنجاح.',true);clearForm();await loadProperties()}catch(e){console.error(e);msg('addMsg','تعذر حفظ العقار. راجع البيانات ثم حاول مجددًا.')}finally{setBusy('addBtn','addSpin',false)}}
function clearForm(){['title','size','price','frontage','depth','documents','video','description'].forEach(id=>$(id).value='');$('cover').value='';$('featured').checked=false;$('status').value='draft';$('priceType').value='negotiable'}
async function loadProperties(){const{data,error}=await db.from('properties').select('id,property_number,title,status,price,size_m2,created_at,areas(name),property_images(storage_path,is_cover,sort_order)').order('created_at',{ascending:false});if(error){$('list').textContent='تعذر تحميل العقارات.';return}if(!(data||[]).length){$('list').innerHTML='<p class="muted">لا توجد عقارات بعد.</p>';return}$('list').innerHTML='';for(const p of data){const wrap=document.createElement('div');wrap.className='item';const imgs=(p.property_images||[]).slice().sort((a,b)=>(b.is_cover-a.is_cover)||(a.sort_order-b.sort_order));let img='';if(imgs[0])img=db.storage.from('property-media').getPublicUrl(imgs[0].storage_path).data.publicUrl;wrap.innerHTML=`<div class="row"><div class="item-main">${img?`<img class="thumb" src="${esc(img)}" alt="">`:'<div class="thumb"></div>'}<div><strong>${esc(p.title)}</strong><div class="muted">#${esc(p.property_number)} · ${esc(p.areas?.name||'')} · ${p.size_m2?Number(p.size_m2).toLocaleString('ar-LY')+' م²':''}</div><span class="status">${esc(statusLabel(p.status))}</span></div></div><div class="actions"></div></div>`;const actions=wrap.querySelector('.actions');if(p.status!=='published')actions.appendChild(makeButton('نشر',()=>setStatus(p.id,'published')));if(p.status==='published')actions.appendChild(makeButton('إخفاء',()=>setStatus(p.id,'hidden'),'secondary'));if(currentProfile?.role==='admin')actions.appendChild(makeButton('حذف',()=>deleteProperty(p.id,p.title),'danger'));$('list').appendChild(wrap)}}
function statusLabel(s){return({draft:'مسودة',published:'منشور',hidden:'مخفي',archived:'مؤرشف'})[s]||s}
function makeButton(text,fn,cls=''){const b=document.createElement('button');b.type='button';b.textContent=text;if(cls)b.className=cls;b.addEventListener('click',fn);return b}
async function setStatus(id,status){if(!currentUser)return;const{error}=await db.from('properties').update({status,updated_by:currentUser.id}).eq('id',id);if(error){alert('تعذر تحديث حالة العقار.');return}loadProperties()}
async function deleteProperty(id,title){if(currentProfile?.role!=='admin'||!confirm(`حذف «${title}» نهائيًا؟`))return;const{data:imgs}=await db.from('property_images').select('storage_path').eq('property_id',id);const paths=(imgs||[]).map(x=>x.storage_path).filter(Boolean);if(paths.length)await db.storage.from('property-media').remove(paths);const{error}=await db.from('properties').delete().eq('id',id);if(error){alert('تعذر حذف العقار.');return}loadProperties()}
$('loginBtn').addEventListener('click',login);$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logoutBtn').addEventListener('click',logout);$('addBtn').addEventListener('click',addProperty);$('refreshBtn').addEventListener('click',loadProperties);
init();
</script></body></html>
